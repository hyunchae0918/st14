<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display</title>
  <style>
    *{margin:0; padding:0;}
    header{
      width:auto;
      border-bottom: 1px solid #000;
      /* background-color: #ccc; */
    }
    nav{
      width:80%;
      padding-left: 50px;
      box-sizing: content-box;

      /* background-color: #ef6; */
    }
    nav ul.gnb{
      list-style: none;
      /* background-color:#f6c; */
    }
    nav ul.gnb li{
      /* 블럭 레벨을 줄바꿈 없이 한줄로, 하지만 크기를 지정 가능 */
      display: inline-block;
      width:auto;
      /* padding:1em 2em; */
      /* width: 130px; */
      text-align: center;
      /* background-color: #6cf; */
    }
    nav ul.gnb li a{
      /* display를 선언하지 않으면 inline. 동일한 a태그마다 여백 지정 */
      display:inline-block;
      width:auto;
      padding:0.5em 2em;
      /* background-color: #fff; */
    }
  </style>
</head>
<body>
</body>
  <header>
    <nav>
      <ul class="gnb">
        <li><a href="">long long menu1</a></li>
        <li><a href="">menu2</a></li>
        <li><a href="">menu3</a></li>
        <li><a href="">menu4</a></li>
        <li><a href="">m5</a></li>
      </ul>
    </nav>
  </header>
</html>
