<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뷰티의 카드 디자인</title>
  <style>
    *{margin: 0;padding: 0;}
    body{
      margin: 50px; 
    }
    /* 1. 작업 전 reset 
       2. 이미지 크기 처리 방식: 부모의 너비에 따라 유연한 크기 
          -> 부모 크기 그대로 -> width:100%
          -> .ec-base-product .pdrList__item .thumbnail a img{width:100%}*/
    ul,ol,li{list-style: none;}
    .ec-base-product{
      width: auto;
    }
    .ec-base-product ul.prdList{
      width: auto;
      background-color: #333;
      /* display inline0block으로 인한 한칸 공백문자 없애기
      -> 자식에게 font-size: 0,  line-height: 0; !!!!! */
      font-size: 0;
      line-height: 0;
    }
    .ec-base-product ul.prdList>li{
      display: inline-block;
      width: 33.333%;
      background-color: #ccc;
      border: 1px solid #f00;
      box-sizing: border-box;
      /* ul(위의 부모)의 'font-size: 0,  line-height: 0;'를 다시 재설정!!!!! */
      font-size: 16px;
      line-height: 1.4;
    }
    .ec-base-product .prdList__item{
      padding: 0 10px;
    }

    .ec-base-product .prdList__item .thumbnail{}
    .ec-base-product .prdList__item .thumbnail a{
      display: block;
    }
    .ec-base-product .prdList__item .thumbnail a img{
      /* 부모의 너비를 따라서 유연한 크기 조정!!!!! */
      width: 100%;
      display: block;
    }

    .ec-base-product .prdList__item .description{
      background-color: rgba(148, 206, 40, 0.904);
    }
    .ec-base-product .prdList__item .description .name{}
    .ec-base-product .prdList__item .description .spec{}
    .ec-base-product .prdList__item .description .spec li{}

  </style>
</head>
<body>
  <div class="ec-base-product">
    <ul class="prdList grid4">
      <li>
        <div class="prdList__item">
          <div class="thumbnail">
            <a href=""><img src="images/imgi_28_20250919160602324_6041.jpg" alt="상품명 1"></a>
          </div>
          <div class="descrition">
            <div class="name">상품명 1</div>
            <ul class="spec">
              <li>10,000원</li>
            </ul>
          </div>
        </div>
      </li>
      <li>
        <div class="prdList__item">
          <div class="thumbnail">
            <a href=""><img src="images/imgi_29_20250919160817340_2097.jpg" alt="상품명 2"></a>
          </div>
          <div class="descrition">
            <div class="name">상품명 2</div>
            <ul class="spec">
              <li>10,000원</li>
            </ul>
          </div>
        </div>
      </li>
      <li>
        <div class="prdList__item">
          <div class="thumbnail">
            <a href=""><img src="images/imgi_30_20250919160646130_3933.jpg" alt="상품명 3"></a>
          </div>
          <div class="descrition">
            <div class="name">상품명 3</div>
            <ul class="spec">
              <li>10,000원</li>
            </ul>
          </div>
        </div>
      </li>
    </ul>
  </div>
</body>
</html>
