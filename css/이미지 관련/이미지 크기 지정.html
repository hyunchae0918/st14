<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 크기 지정</title>
  <style>
    *{margin: 0;padding: 0; box-sizing: border-box;}
    body{margin: 50px;}
    .img-wrap{
      background-color: #ccc;
      border: 1px solid #000;
      /* .img-wrap에 지정된 폰트 사이즈를 기준으로 해서 */
      padding: 1em;
      width: 80%;
      height: 300px;
    }
    /* 이미지 크기 고정 지정!!! */
    /* .img-wrap img{width: 300px; height: 200px;} */

    /* 부모의 너비를 따라서 이미지 크기를 유연하게 조정!
     단, 내 이미지의 기본 비율을 유지!! */
    /* .img-wrap img{width: 100%; height: auto;} */

    /* 이미지가 부모의 높이를 따라가고 너비는 비율에 맞춰서! */
    .img-wrap img{
      /* width: auto; 
      height: 100%; */
    }

    /* 이미지는 부모의 너비를 따르지만 이미지 원래 크기 이상은 커지지 말아라! */
    .img-wrap img{
      width: auto; 
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="img-wrap"><img src="https://images.pexels.com/photos/6207744/pexels-photo-6207744.jpeg" alt=""></div>

  <div class="img-wrap"><img src="https://cdn-icons-png.flaticon.com/512/10488/10488992.png" alt=""></div>
</body>
</html>
