<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>둥근 이미지 만들기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  <style>
    *{margin: 0;padding: 0; box-sizing: border-box;}
    body{
      font-family: Pretendard;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
    }

    .hero-wrap{
      /* hero-wrap .slogan의 기준 요소가 되기 위해서 */
      position: relative;
      /* width: 100vw; 스크롤바 공간까지 포함한 너비 */
      width: 100%;
      }

    .hero-wrap .img-wrap{
      width: 50%; 
      height: 100vh;
      /* 둥근 이미지 만들기 */
      border-radius: 50% 50% 0 50%;
      overflow: hidden;
    }
    .hero-wrap .img-wrap img{
      display: block;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center center;
      /* filter: blur(5px) grayscale(10%); */
      transition: filter 0.5s;
    }
 

    .hero-wrap .slogan{
      /* position: absolute는 
         1. 기준 요소 지정: .hero-wrap
         2. 위치 지정 
         3. 너비 높이 지정 */
      position: absolute;  /*1 2*/
      /* 요소의 위치를 부모의 가운데 배치 */
      /* right: 50px;  */
      left: 50%; 
      top:50%;  /*2*/
      transform: translate(100px, -50%);  /*2*/

      background-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0px 0px 20px 0px rgba(0, 0, 0, 0.5);
      /* em은 폰트 사이즈 속성을 제외한 css 속성에 지정하면 해당 요소의
      폰트 사이즈 기준 */
      padding: 1em 2em;  /*3*/
      width: 50%;  /*3*/
      max-width: 700px;  /*3*/
      min-width: 470px;  /*3*/
    }
    .hero-wrap .slogan .title{
      font-size: 3em;
      font-weight: 200;
    }
    .hero-wrap .slogan .desc{
      font-size: 1.2em;
      font-weight: 300;
    }


    /* <img src="https://images.pexels.com/photos/6207744/pexels-photo-6207744.jpeg" alt=""> */
  </style>
</head>
<body>
  <div class="hero-wrap">
    <div class="img-wrap">
      <img src="https://images.pexels.com/photos/6207744/pexels-photo-6207744.jpeg" alt=""></div>
    <div class="slogan">
      <p class="title">Lorem, ipsum dolor.</p>
      <p class="desc">Lorem ipsum dolor sit amet consectetur adipisicing elit. Placeat consequuntur repellat eaque?</p>
    </div>
  </div>
</body>
</html>
