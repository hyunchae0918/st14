<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>float 연습2-퍼센트 계산</title>
</head>
<style>
  *{margin: 0;padding: 0;}
  .wrap{
    background-color: #ccc;
  }
  header{
    /* width: auto;
    height: auto; */
    min-height: 50px;
    margin-bottom: 20px;
    background-color: #f00;
  }
  .container{
    width: 95%;
    min-width: 1040px;
    min-width: 1400px;
    margin: 0 auto;
    /* float로 지정된 자식 요소를 인식하기 위해서 overflow(hidden) 지정!!!*/
    overflow: hidden;
    background-color: #aaa;
  }
  /* float 지정된 요소 이후에 있는 인라인 요소에게 float 영향 제거!!! */
  .container::after{
    content: "";
    display: block;
    clear: both;
  }

  /* 단으로 처리: lnb, main, right */
  .lnb{
    float: left;
    /* width: 20%; */
    /* 값을 함수로 제공!!!!! */
    width: calc(20% - 20px);
    min-height: 400px;
    margin-right: 20px;
    background-color: #ef6;
  }
  .main-wrap{
    float: left;
    /* width: 60%; */
    width: calc(60% - 20px);
    min-height: 500px;
    background-color: #6fc;
  }
  .main-wrap section{}
  .right{
    float: right;
    width: 20%;
    min-height: 500px;
    background-color: #fc6;
  }
  footer{
    min-height: 100px;
    background-color: #0f0;
  }

</style>
<body>
  <div class="wrap">
    <header>헤더</header>
    <div class="container">
      <div class="lnb">lnb</div>
      <main class="main-wrap">
        <section>메인 내용</section>
      </main>
      <aside class="right">관련 내용</aside>
    </div>
    <footer>푸터</footer>
  </div>
</body>

</html>
