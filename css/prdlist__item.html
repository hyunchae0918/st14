<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>prdlist__item position 연습</title>
  <style>
    *{margin: 0;padding: 0;}
    ol, ul, li{list-style: none;}
    a:link, a:visited, a:active{
      color:currentColor;
      text-decoration: none;}
    body{margin: 50px; color: #333;}

    li.xans-record-{
      box-sizing: border-box;
      /* 너비는 부모에게!!!!! */
      min-width: 400px;
      width: 50%;
      background-color: #ccc;
      border: 1px solid #000;

      
    }
    .prdList__item{
      /* .descrition의 기준이 됨 */
      position: relative;
      box-sizing: inherit;
      width: auto;
      height: auto;
    }
    .prdList__item .thumbnail{
      /* .prdList__item .thumbnail .likeButton,
      .prdList__item .thumbnail .sale_box,
      .prdList__item .thumbnail .icon__box
      의 기준점을 주려고 설정 */
      position: relative;
      background-color: #6cf;
    }
    .prdList__item .thumbnail>a{
      /* 너비와 높이를 지정하려고, 
      또는 부모의 너비를 가져오고 자식의 높이를 인식하려고!!!!! */
      display: block;
    }
    .prdList__item .thumbnail>a img{
      display: block;
      min-height: 530px;
      background-color: #fc6;
    }
    .prdList__item .thumbnail .likeButton{
      width: 80px; height: 80px;
      background-color: rgba(255,0,0,0.5);
      position: absolute;
      left: 10px; top: 10px;
    }
    .prdList__item .thumbnail .icon__box{
      /* 브라우저에 표시하지 말아라 */
      /* display: none;  */
      opacity: 0;
      position: absolute;
      /* 기준 요소의 컨텐트 영역의 너비를 가져옴 */
      width: 100%;
      left: 0; top: 50%;
      background-color: rgba(0,255,0,0.5);
      text-align: center;
    }
    .xans-record-:hover .prdList__item .thumbnail .icon__box{
      /* display: block; */
      opacity: 1;
    }

    .prdList__item .thumbnail .icon__box span{
      display: inline-block;
      width: auto; height: auto;
      border: 1px solid #000;
      margin-right: 20px;
      padding: 0.5em 2em;
      border-radius: 22px;
      
    }
    .prdList__item .thumbnail .sale_box{
      width: 80px; height: 80px;
      background-color: rgba(0,0,255,0.5);
      position: absolute;
      right: 10px; top: 10px;
      border-radius: 50%;
      text-align: center;
    }

    .prdList__item .description{
      /* 기준요소에게 position:relative */
      position: absolute;
      /* 기준요소의 너비를 가져와라 */
      width: 100%;
      left: 0; bottom: 0;
      box-sizing: inherit;
      min-height: 150px;
      background-color: rgba(238,238,238,0.5);
      border: 1px solid #00f;
    }
  </style>
</head>
<body>
  <li class="xans-record-">
    <div class="prdList__item">
      <div class="thumbnail">
        <a href="">
          <img src="" alt="샘플위치" width="400" height="530">
        </a>
        <div class="likeButton">좋아요 버튼</div>
        <div class="icon__box">
          <span>wish</span>
          <span>cart</span>
          <span>option</span>
        </div>
        <div class="sale_box">90%</div>
        </div>
        <div class="description">설명</div>
      </div>
    </div>
  </li>
</body>
</html>
