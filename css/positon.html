<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>position</title>
  <style>
    *{margin: 0;padding: 0;}
    .container{
      /* 3,4,5의 기준 요소가 됨 */
      position: relative;
      margin: 100px;
      background-color: #ccc;
    }
    .box{
      width: 100px;
      height: 100px;
    }
    .box:nth-child(odd){
      background-color: #ef6;
    }
    .box:nth-child(even){
      background-color: #f6e;
    }
    .box1{
      /* 위치를 지정하는 left, right, top, bottom 속성의 값을 인식하지 못함 */
      position: static;
      left: 100px; top: 100px;
    }
    .box2{
      /* 기준이 누구인지 확인해야 함, 기준은 본인, 부모가 넓이와 높이 인식 가능. 일반 흐름 o */
      position: relative;
      left: 50px; top: 50px;
    }
    /* position: absolute; 가까운 조상 중에  position: static을 제외한 포지션이 선언된 요소
    일반 흐름에서 벗어남, 부모가 인식을 못함,
    레이어 개념 추가: 뒤에 작성된 요소가 상위 레이어가 됨 */
    .box3, .box4, .box5{
      position: absolute;
      /* left: 50px; top: 50px; */
    }
    .box3{
      right: 0; top: 0;
    }
    .box4{
      right: 50px;
      bottom: -50px;
    }
    .box5{
      left: 120px;
      top: 40px;
    }
    .box6{
      /* nomal flow에서 벗어남(일반 흐름에서 벗어남), 기준은 브라우저! */
      position: fixed;
      right: 50px;
      bottom: 50px;
    }
    body{
      height: 3000px;
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="box box1">
      <div class="child">box1</div>
    </div>
    <div class="box box2">
      <div class="child">box2</div>
    </div>
    <div class="box box3">
      <div class="child">box3</div>
    </div>
    <div class="box box4">
      <div class="child">box4</div>
    </div>
    <div class="box box5">
      <div class="child">box5</div>
    </div>
    <div class="box box6">
      <div class="child">box6</div>
    </div>
  </div>
</body>
</html>
