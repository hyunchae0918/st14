    .ec-base-product{

      /* overflow: hidden; */

    .ec-base-product ul.prdList{

    /* .ec-base-product ul.prdList>li{

    .ec-base-product ul.prdList{
      display: flex;
      /* flex-direction: row; 기본값이라 생략 가능 */
      /* flex-wrap: nowrap; 기본값이라 생략 가능 */
      /* gap: 0; 생략 */
      justify-content: start;
      align-items: start;

      width: auto;
      margin: 0 -10px;
      background-color: #ccc;
    }

    .ec-base-product ul.prdList>li{
      /* flex-grow: 0; 기본값이라 생략 가능 */
      flex-shrink: 0; /* 기본값이 1이기 때문에 0으로 지정 */
      /* flex-basis: auto; 기본값이라 생략 가능 */
      
    }

/* 상품의 단레이아웃 크기 지정
   : 단처리는 클래스명을 별도로 사용해서 html에서 지정해서 작업!!!!! */
    .ec-base-product ul.grid2>li{width: 50%;}
    .ec-base-product ul.grid3>li{width: 33.33%;}
    .ec-base-product ul.grid4>li{width: 25%;}
    .ec-base-product ul.grid5>li{width: 20%;}

    .ec-base-product .prdList__item{
      padding: 0 10px;
      position: relative;
      overflow: hidden;
    }

    .ec-base-product .prdList__item .thumbnail{}
    .ec-base-product .prdList__item .thumbnail a{
      display: block;
    }
    .ec-base-product .prdList__item .thumbnail a img{
      width: 100%;
      display: block;
    }

    .ec-base-product .prdList__item .description{
      box-sizing: border-box;
      padding: 0.8em 1em;
      

      position: absolute;
      left: 10px; bottom: 0;
    
      width: calc(100%-20px);
      background-color: rgba(225, 225, 225, 0.5);
     
      transform: translateY(100%);
      opacity: 0.5;
      transition: all 0.3;

    }
    .ec-base-product .prdList__item:hover .description{
      transform: translateY(0);
    
      opacity: 1;
      transition: transform 1s;

    }

    .ec-base-product .prdList__item .description .name{
      margin-bottom: 1em;
      font-weight: bold;
    }
    .ec-base-product .prdList__item .description .spec{}
    .ec-base-product .prdList__item .description .spec li{}

  </style>
</head>
