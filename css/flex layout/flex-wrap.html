<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex-item</title>
  <style>
    *{margin: 0;padding: 0; box-sizing: border-box;}
    .section{
      padding: 30px;
    }
    .section-title{
      background-color: #ccc;
      font-size: 1.5em;
      font-weight: 700;
    }
    .section-content{
      padding-top: 30px;
    }
    .section-content .item{
      /* width: 100px; min-height: 100px; */
      background-color: dodgerblue;
      border: 1px solid darkblue;
    }
    .section-content > div{
      background-color: #f6e;
    }
/* flex box 선언 */
    .section-content > div{
      /* 해당 요소는 flex-container1,2,3,4, 
         직계 자식 요소는 flex item */
      display: flex;
    }
  </style>
</head>

<body>
  <style>
    .flex-container1{
      flex-direction: row;
    }
    .flex-container1 .item{
      flex-grow: 1;
      /* flex-grow:1; width:100px;일 경우,
      item은 100px이 아니고 컨테이너 영역 크기에 맞게 늘어남
      (width가 제 역할을 못함) */
      /* flex-grow:0; width:100px;일 경우,
      item은 100px보다 커지지 않음, 하지만 작아질 수도 있음*/
      /* width: 200px; */
    }
  </style>
  <div class="section">
    <div class="section-title">1. flex-wrap: nowrap; 아이템의 총합이 container보다 커도 줄바꿈 x</div>
    <div class="section-content">
      <div class="flex-container1">
        <div class="item">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
      </div>
    </div>
  </div>

  <style>
    .flex-container2{
      width: 600px;
      display: flex;
      justify-content: flex-start;
      /* item이 wrap이 되지 않는 상태 */
      align-items: center;
      min-height: 200px;
      flex-wrap: wrap;
      /* flex-weap이 되었을 때 교차축 정렬 */
      align-content: center;
    }
    .flex-container2 .item{
      /* flex-grow: 0;
      flex-shrink: 0;
      flex-basis: auto; */
      flex:none;
      width: 150px;
    }
  </style>
  <div class="section">
    <div class="section-title">2. flex-wrap: wrap; 아이템의 총합이 container보다 크면 줄바꿈 o</div>
    <div class="section-content">
      <div class="flex-container2">
        <div class="item">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
        <div class="item">item5</div>
        <div class="item">item6</div>
        <div class="item">item7</div>
        <div class="item">item8</div>
      </div>
    </div>
  </div>

  <!-- flex-wrap: wrap; 단 레이아웃 -->
  <style>
    .flex-container3{
      display: flex;
      flex-direction: row;
      /* 컨테이너의 크기가 아이템의 총합보다 작을 경우 아이템이 줄바꿈해서 배치 */
      flex-wrap: wrap;
      justify-content: flex-start;
      align-content: start;
      gap: 10px;
    }
    .flex-container3 .item{
      /* flex-grow: o;
      flex-shrink: 0;
      flex-basis: auto; */
      flex: none;
      /* gap을 10px로 설정했기 때문에 30/4 -> 7.5px을 뺌 */
      width: calc(25% - 7.5px);
    }
  </style>
  <div class="section">
    <div class="section-title">3. flex-wrap: wrap; 4단 레이아웃</div>
    <div class="section-content">
      <div class="flex-container3">
        <div class="item">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
        <div class="item">item5</div>
        <div class="item">item6</div>
        <div class="item">item7</div>
        <div class="item">item8</div>
      </div>
    </div>
  </div>

</body>
</html>
