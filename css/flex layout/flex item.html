<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex-item</title>
  <style>
    *{margin: 0;padding: 0; box-sizing: border-box;}
    .section{
      padding: 30px;
    }
    .section-title{
      background-color: #ccc;
      font-size: 1.5em;
      font-weight: 700;
    }
    .section-content{
      padding-top: 30px;
    }
    .section-content .item{
      /* width: 100px; min-height: 100px; */
      background-color: dodgerblue;
      border: 1px solid darkblue;
    }
    .section-content > div{
      background-color: #f6e;
    }
/* flex box 선언 */
    .section-content > div{
      /* 해당 요소는 flex-container1,2,3,4, 
         직계 자식 요소는 flex item */
      display: flex;
    }
  </style>
</head>

<body>
  <style>
    .flex-container1{
      flex-direction: row;
    }
    .flex-container1 .item{
      flex-grow: 1;
      /* flex-grow:1; width:100px;일 경우,
      item은 100px이 아니고 컨테이너 영역 크기에 맞게 늘어남
      (width가 제 역할을 못함) */
      /* flex-grow:0; width:100px;일 경우,
      item은 100px보다 커지지 않음, 하지만 작아질 수도 있음*/
      /* width: 200px; */
    }
  </style>
  <div class="section">
    <div class="section-title">1. flex-item 크기 자동 늘리기: flex-grow: 1; flex-grow: 0;</div>
    <div class="section-content">
      <div class="flex-container1">
        <div class="item">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
      </div>
    </div>
  </div>

<!-- flex-shrink item 주축 크기의 수축 -->
<style>
  /* flex-shrink: flex-container가 아이템의 총합의 크기보다 작을 경우 아이템 크기를 flex-container에 맞게 수축해라 */
  .flex-container2 .item{
      flex-grow:0; 
      width: 150px;
      flex-shrink: 0;

    }
</style>    

  <div class="section">
    <div class="section-title">2. flex-shrink item 주축 크기의 수축</div>
    <div class="section-content">
      <div class="flex-container2">
        <div class="item">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
      </div>
    </div>
  </div>
  <!-- flex item이 flex container 크기에 맞게 늘어나고 줄어들어라 -->
   <style>
    .flex-container3 .item{
      flex-grow: 1;
      flex-shrink: 1;
    }
   </style>
  <div class="section">
    <div class="section-title">3. flex-grow:1; flex-shrink:1;</div>
    <div class="section-content">
      <div class="flex-container3">
        <div class="item">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
      </div>
    </div>
  </div>
<!-- flex item의 크기 지정: flex-basis -->
  <style>
    .flex-container4 .item{
      /* flex-grow: 1;
      flex-shrink: 1; */
      flex-grow: 0;
      flex-shrink: 0;
      flex-basis: 300px;
      width: 150px;
    }
  </style>
  <div class="section">
    <div class="section-title">4. flex 아이템의 기본 주축 크기 지정: flex-basis</div>
    <div class="section-content">
      <div class="flex-container4">
        <div class="item">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
      </div>
    </div>
  </div>
</body>
</html>
